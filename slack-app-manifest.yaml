display_information:
  name: FOX3 Local Bridge
  description: Bridge to a local Claude Code session (DM only, allowlisted users)
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: fox3-local
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write        # 返信と permission の投稿
      - im:history        # message.im の受信に必要
      - im:write          # conversations.open（許可ユーザーとの DM を特定）
      - reactions:write   # 受信 / 判定のリアクション
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
