display_information:
  name: Claude Code Bridge
  description: Bridge to a local Claude Code session (DM and allowlisted channels, allowlisted users)
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: claude-code
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write        # 返信と permission の投稿
      - im:history        # message.im の受信に必要
      - im:write          # conversations.open（許可ユーザーとの DM を特定）
      - channels:history  # message.channels の受信に必要（access.json の channels に書いた公開チャンネル）
      - groups:history    # message.groups の受信に必要（access.json の channels に書いた非公開チャンネル）
      - reactions:write   # 受信 / 判定のリアクション
      - users:read        # npm run check で allowFrom の表示名を確認（users.info）
settings:
  event_subscriptions:
    bot_events:
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
